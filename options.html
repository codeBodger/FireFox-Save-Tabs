<!DOCTYPE html>
<!-- Modified from https://addons.mozilla.org/en-CA/firefox/addon/show-profile/ -->
<html>
  <head>
    <meta charset="utf-8">
  </head>

<body>
  <p>Enter the name of the current profile directory.  In this way, whenever you
  save your tabs, the file will also contain information about which profile it
  was loaded from, so when you open it, it will open in the right profile.
  </p>
  <form>
    <div>
      <label>Profile Directory</label>
      <input type="text" id="profile-dir" >
    </div>
    <br />
    <div>
      <button type="submit">Save</button>
    </div>
  </form>
  <script src="options.js"></script>
</body>

</html>
